 "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_6_1", "gold_label": NaN, "mistralai_mistral-large-2512": "reader-information", "mistralai_mistral-large-2512_subtype": "meta-information", "z-ai_glm-5": "reader-information", "z-ai_glm-5_subtype": "meta-information", "deepseek_deepseek-v3.2-speciale": "reader-information", "deepseek_deepseek-v3.2-speciale_subtype": "meta-information", "openai_gpt-oss-120b": "reader-information", "openai_gpt-oss-120b_subtype": "meta-information", "openai_gpt-oss-20b": "reader-information", "openai_gpt-oss-20b_subtype": "meta-information", "book_file": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json", "section_idx": 6, "chunk_idx": 1, "text": "F\u00fcr Atlan, den Einsamen der Zeit, sind die Jahrhunderte nur wie ein Tag, denn er besitzt den r\u00e4tselhaften Zellschwingungsaktivator. Er studiert die Menschen seit den Anf\u00e4ngen der bekannten Geschichte, und er hilft den Menschen, wenn eine solche Unterst\u00fctzung gleichzeitig seine eigenen Pl\u00e4ne f\u00f6rdert. Atlan will heim nach Arkon, der Welt der drei Planeten! Atlan hat die kleinen, mutigen Barbaren von Terra liebgewonnen \u2013 auch wenn er es sich manchmal nicht eingestehen will. Atlan f\u00fcrchtete den drohenden Atomkrieg des Jahres 1971 und zog sich in seinen unterseeischen St\u00fctzpunkt zur\u00fcck \u2013 doch als er aus seinem 69 Jahre w\u00e4hrenden Tiefschlaf erwacht, findet er eine v\u00f6llig ver\u00e4nderte Welt vor! Atlan sieht sich nun der Erf\u00fcllung seiner Sehnsucht nahe. \u2013 Nur einer steht ihm noch im Wege: Perry Rhodan, der Administrator des Solaren Imperiums! Perry Rhodan, der nur an das Wohl der Menschheit denkt, muss Atlan die Heimkehr verwehren. Kann Perry Rhodan das, oder ist Atlan auf Grund der vielhundertj\u00e4hrigen Erfahrung seinem Gegenspieler weit \u00fcberlegen ...? Bei dem erregenden Duell auf dem Hitzeplaneten Hellgate hatte sich Perry Rhodan als der Bessere erwiesen! Atlan geriet in die Gefangenschaft des Solaren Sicherheitsdienstes, aber seine Gedanken besch\u00e4ftigen sich bereits mit den M\u00f6glichkeiten einer zweiten Flucht. Wird Atlan das Ziel seiner W\u00fcnsche erreichen ...?"}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_6_2", "gold_label": NaN, "mistralai_mistral-large-2512": "reader-information", "mistralai_mistral-large-2512_subtype": "castlist", "z-ai_glm-5": "reader-information", "z-ai_glm-5_subtype": "castlist", "deepseek_deepseek-v3.2-speciale": "reader-information", "deepseek_deepseek-v3.2-speciale_subtype": "castlist", "openai_gpt-oss-120b": "reader-information", "openai_gpt-oss-120b_subtype": "castlist", "openai_gpt-oss-20b": "reader-information", "openai_gpt-oss-20b_subtype": "castlist", "book_file": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json", "section_idx": 6, "chunk_idx": 2, "text": "Die Hauptpersonen des Romans Atlan alias Olaf Peterson alias Hinrich Volkmar \u2013 Er hat die \u00bbkleinen Barbaren von Terra\u00ab liebgewonnen. Perry Rhodan \u2013 Der m\u00e4chtigste Mann im Solsystem. Marlis Gentner \u2013 Eine junge Kosmobiologie-Studentin mit ausgepr\u00e4gtem Gerechtigkeitssinn. Gunter Vie\u00dfpahn \u2013 Ein b\u00e4rtiger Venuskolonist mit schlechten Manieren. Gucky \u2013 Der Mausbiber h\u00e4lt nichts vom venusischen Sicherheitsdienst. Tombe Gmuna \u2013 Atlans Leibw\u00e4chter."}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_7_0", "gold_label": NaN, "mistralai_mistral-large-2512": "cover-image", "mistralai_mistral-large-2512_subtype": "none", "z-ai_glm-5": "cover-image", "z-ai_glm-5_subtype": "none", "deepseek_deepseek-v3.2-speciale": "cover-image", "deepseek_deepseek-v3.2-speciale_subtype": "none", "openai_gpt-oss-120b": "cover-image", "openai_gpt-oss-120b_subtype": "none", "openai_gpt-oss-20b": "cover-image", "openai_gpt-oss-20b_subtype": "none", "book_file": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json", "section_idx": 7, "chunk_idx": 0, "text": ""}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_7_1", "gold_label": NaN, "mistralai_mistral-large-2512": "reader-information", "mistralai_mistral-large-2512_subtype": "meta-information", "z-ai_glm-5": "reader-information", "z-ai_glm-5_subtype": "meta-information", "deepseek_deepseek-v3.2-speciale": "reader-information", "deepseek_deepseek-v3.2-speciale_subtype": "meta-information", "openai_gpt-oss-120b": "reader-information", "openai_gpt-oss-120b_subtype": "meta-information", "openai_gpt-oss-20b": "reader-information", "openai_gpt-oss-20b_subtype": "meta-information", "book_file": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json", "section_idx": 7, "chunk_idx": 1, "text": "Trotz geschickter Schachz\u00fcge im galaktischen Raum musste Perry Rhodans Streben nach Macht und Anerkennung der Menschheit im Universum letztlich St\u00fcckwerk bleiben, denn die der Menschheit seinerzeit zur Verf\u00fcgung stehenden Mittel waren, an den Ma\u00dfst\u00e4ben des Universums gemessen, zu klein. Seit der angeblichen Vernichtung der Erde im Jahre 1984 sind inzwischen 56 Jahre vergangen. Eine neue Menschengeneration ist herangewachsen. Wie sich seinerzeit aus der \u00bbDritten Macht\u00ab die terranische Weltregierung entwickelte, so ist aus eben dieser Weltregierung inzwischen l\u00e4ngst die Organisation des Solaren Imperiums entstanden. Mars, Venus, die Jupiter- und Saturnmonde sind besiedelt, und die f\u00fcr Besiedlungszwecke ungeeigneten Welten des Solsystems dienen als terranische St\u00fctzpunkte oder aber als unersch\u00f6pfliche Fundgruben f\u00fcr Bodensch\u00e4tze aller Art. Andere Intelligenzen sind im Solsystem nicht entdeckt worden. Die Terraner sind somit die unbestrittenen Beherrscher eines kleinen Planetenreiches, dessen Mittelpunkt die Erde bildet. Dieses technisch und zivilisatorisch hochstehende Planetenreich besitzt nat\u00fcrlich eine schlagkr\u00e4ftige Raumflotte, die in der Lage sein sollte, jedem Angreifer die Stirn zu bieten. Doch Perry Rhodan, der Administrator des Solaren Imperiums, ist noch nicht bereit, den sch\u00fctzenden Mantel der Anonymit\u00e4t fallen zu lassen. Seine kosmischen Agenten \u2013 Mitglieder des ber\u00fchmten Mutantenkorps \u2013 haben nach wie vor die Order, ihren terranischen Ursprung unter allen Umst\u00e4nden geheim zu halten. Bisher hatte sich Perry Rhodan auf seine Mutanten hundertprozentig verlassen k\u00f6nnen \u2013 doch die Geschehnisse im Heper\u00e9s-System zeugen davon, dass auch Mutanten nur Menschen mit allen menschlichen Fehlern und Schw\u00e4chen sind ..."}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_8_0", "gold_label": NaN, "mistralai_mistral-large-2512": "cover-image", "mistralai_mistral-large-2512_subtype": "none", "z-ai_glm-5": "cover-image", "z-ai_glm-5_subtype": "none", "deepseek_deepseek-v3.2-speciale": "cover-image", "deepseek_deepseek-v3.2-speciale_subtype": "none", "openai_gpt-oss-120b": "cover-image", "openai_gpt-oss-120b_subtype": "none", "openai_gpt-oss-20b": "cover-image", "openai_gpt-oss-20b_subtype": "none", "book_file": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json", "section_idx": 8, "chunk_idx": 0, "text": ""}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_8_2", "gold_label": NaN, "mistralai_mistral-large-2512": "reader-information", "mistralai_mistral-large-2512_subtype": "castlist", "z-ai_glm-5": "reader-information", "z-ai_glm-5_subtype": "castlist", "deepseek_deepseek-v3.2-speciale": "reader-information", "deepseek_deepseek-v3.2-speciale_subtype": "castlist", "openai_gpt-oss-120b": "reader-information", "openai_gpt-oss-120b_subtype": "castlist", "openai_gpt-oss-20b": "reader-information", "openai_gpt-oss-20b_subtype": "castlist", "book_file": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json", "section_idx": 8, "chunk_idx": 2, "text": "Die Hauptpersonen des Romans Perry Rhodan \u2013 Erster Administrator des Solaren Imperiums. Gucky \u2013 Er beweist, dass \u00bbM\u00e4use\u00ab vor \u00bbKatzen\u00ab keine Angst zu haben brauchen. Andr\u00e9 Noir \u2013 Ein altes und treues Mitglied des Mutantenkorps. Fellmer Lloyd \u2013 Die \u00bbAllweise Mutter\u00ab sch\u00fctzt ihn. Gregor Tropnow und Nomo Yatuhin \u2013 Zwei Verschw\u00f6rer, die ihre Heimat verraten wollen. Mansrin \u2013 Der arkonidische Gouverneur auf Volat. Talamon \u2013 Der \u00dcberschwere sieht einen Mann, den er l\u00e4ngst f\u00fcr tot hielt."}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_10_1", "gold_label": NaN, "mistralai_mistral-large-2512": "reader-information", "mistralai_mistral-large-2512_subtype": "preview", "z-ai_glm-5": "reader-information", "z-ai_glm-5_subtype": "preview", "deepseek_deepseek-v3.2-speciale": "reader-information", "deepseek_deepseek-v3.2-speciale_subtype": "advertisement", "openai_gpt-oss-120b": "reader-information", "openai_gpt-oss-120b_subtype": "advertisement", "openai_gpt-oss-20b": "reader-information", "openai_gpt-oss-20b_subtype": "preview", "book_file": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json", "section_idx": 10, "chunk_idx": 1, "text": "Der Robotregent von Arkon ist dar\u00fcber informiert, dass der Untergang der Erde nichts als ein genial angelegter Bluff war \u2013 und damit ist der von Perry Rhodan insgeheim gef\u00fcrchtete Zeitpunkt einer Machtprobe zwischen dem Solaren Imperium und Arkon in bedrohliche N\u00e4he ger\u00fcckt. Ist das Reich der Terraner wirklich stark genug, um auch den m\u00e4chtigsten Angreifer abzuwehren ...? Noch ist die galaktische Position des Solsystems ein Geheimnis \u2013 noch kann Arkon keine Kampfflotte ausschicken, selbst wenn der Robotregent einen solchen Schritt unternehmen wollte ... Aber da tritt pl\u00f6tzlich ein Ereignis ein, das Terra und Arkon zu Verb\u00fcndeten macht! Der Robotregent braucht Hilfe, denn die ATTACKE AUS DEM UNSICHTBAREN bedroht alles Leben in der Milchstra\u00dfe ..."}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_11_0", "gold_label": NaN, "mistralai_mistral-large-2512": "cover-image", "mistralai_mistral-large-2512_subtype": "none", "z-ai_glm-5": "cover-image", "z-ai_glm-5_subtype": "none", "deepseek_deepseek-v3.2-speciale": "cover-image", "deepseek_deepseek-v3.2-speciale_subtype": "none", "openai_gpt-oss-120b": "cover-image", "openai_gpt-oss-120b_subtype": "none", "openai_gpt-oss-20b": "cover-image", "openai_gpt-oss-20b_subtype": "none", "book_file": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json", "section_idx": 11, "chunk_idx": 0, "text": ""}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_11_2", "gold_label": NaN, "mistralai_mistral-large-2512": "reader-information", "mistralai_mistral-large-2512_subtype": "castlist", "z-ai_glm-5": "reader-information", "z-ai_glm-5_subtype": "castlist", "deepseek_deepseek-v3.2-speciale": "reader-information", "deepseek_deepseek-v3.2-speciale_subtype": "castlist", "openai_gpt-oss-120b": "reader-information", "openai_gpt-oss-120b_subtype": "castlist", "openai_gpt-oss-20b": "reader-information", "openai_gpt-oss-20b_subtype": "meta-information", "book_file": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json", "section_idx": 11, "chunk_idx": 2, "text": "Die Hauptpersonen des Romans Leutnant Marcel Rous \u2013 Er hat sich f\u00fcr das Himmelfahrtsunternehmen auf Mirsal II freiwillig gemeldet. Fellmer Lloyd \u2013 Ein Mitglied des Mutantenkorps. Rosita Peres \u2013 Die Kosmo-Psychologin wird aus einer Region zur\u00fcckgebracht, aus der es bisher keine R\u00fcckkehr gab. Kommissar Flaring \u2013 Ein mutiger Mirsalese. Perry Rhodan \u2013 Wer die Unendlichkeit erschaut hat, den k\u00f6nnen auch die perfektesten Roboter nicht beeindrucken. Der Regent von Arkon \u2013 Sein Handikap ist, dass er \u00bbEigenzeiten\  steht auf Warteposition bewegungslos im All. Perry Rhodan wartet auf die Signale jener kosmischen Agenten, die er ausgeschickt hat, um rechtzeitig von neuen Angriffen der Unheimlichen aus der anderen Dimension in Kenntnis gesetzt zu werden. Perry Rhodan ist durch eingehende Berechnungen zu dem Schluss gekommen, dass es sich beim Auftauchen der Unbekannten nicht um willk\u00fcrlich gesteuerte Ma\u00dfnahmen, sondern eher um Aktionen handelt, die auf Grund einer Statistik unternommen wurden. Die \u00dcberschneidung zweier Zeitebenen scheint nach diesen Daten von gewissen Gesetzen abh\u00e4ngig zu sein, die mit den entsprechenden Mitteln logistisch erfasst werden k\u00f6nnen. Das ist auch der Grund, warum nicht nur Perry Rhodan mit der DRUSUS, sondern auch viele andere Einheiten der Solaren Flotte in den Weltraum ausgeschw\u00e4rmt sind. Die DRUSUS empf\u00e4ngt auch eine Meldung h\u00f6chster Dringlichkeitsstufe \u2013 doch diese Meldung ist nichts anderes als ein geschicktes Man\u00f6ver des ROBOT-SPIONS ..."}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_13_2", "gold_label": NaN, "mistralai_mistral-large-2512": "reader-information", "mistralai_mistral-large-2512_subtype": "castlist", "z-ai_glm-5": "reader-information", "z-ai_glm-5_subtype": "castlist", "deepseek_deepseek-v3.2-speciale": "reader-information", "deepseek_deepseek-v3.2-speciale_subtype": "castlist", "openai_gpt-oss-120b": "reader-information", "openai_gpt-oss-120b_subtype": "castlist", "openai_gpt-oss-20b": "reader-information", "openai_gpt-oss-20b_subtype": "castlist", "book_file": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json", "section_idx": 13, "chunk_idx": 2, "text": "Die Hauptpersonen des Romans Perry Rhodan \u2013 Der Kommandant der DRUSUS. Atlan \u2013 Vor vielen Jahrtausenden besa\u00df er selbst einen Possonkal. Jost Kulman \u2013 Der Mikro-Optiker des Mutantenkorps. Reginald Bull \u2013 Er kann es nicht lassen, Guckys Zorn herauszufordern. Gucky \u2013 Man hat den Mausbiber in Verdacht, nicht stubenrein zu sein. Muzzel \u2013 Guckys neuer Spielgef\u00e4hrte springt zu gut."}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_14_0", "gold_label": NaN, "mistralai_mistral-large-2512": "cover-image", "mistralai_mistral-large-2512_subtype": "none", "z-ai_glm-5": "cover-image", "z-ai_glm-5_subtype": "none", "deepseek_deepseek-v3.2-speciale": "cover-image", "deepseek_deepseek-v3.2-speciale_subtype": "none", "openai_gpt-oss-120b": "cover-image", "openai_gpt-oss-120b_subtype": "none", "openai_gpt-oss-20b": "cover-image", "openai_gpt-oss-20b_subtype": "none", "book_file": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json", "section_idx": 14, "chunk_idx": 0, "text": ""}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_14_2", "gold_label": NaN, "mistralai_mistral-large-2512": "reader-information", "mistralai_mistral-large-2512_subtype": "castlist", "z-ai_glm-5": "reader-information", "z-ai_glm-5_subtype": "castlist", "deepseek_deepseek-v3.2-speciale": "reader-information", "deepseek_deepseek-v3.2-speciale_subtype": "castlist", "openai_gpt-oss-120b": "reader-information", "openai_gpt-oss-120b_subtype": "castlist", "openai_gpt-oss-20b": "reader-information", "openai_gpt-oss-20b_subtype": "castlist", "book_file": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json", "section_idx": 14, "chunk_idx": 2, "text": "Die Hauptpersonen des Romans Horace O. Mullon \u2013 Sein M\u00f6rder hat nicht mit den \u00bbblauen Zwergen\u00ab gerechnet. Fraudy Mullon \u2013 Sie lernt, den \u00bbblauen Zwergen\u00ab ihre Gedanken verst\u00e4ndlich zu machen. Milligan \u2013 Mullons rechte Hand. Pashen \u2013 Er erwartet eine Belohnung. Harper, Glannon und Cislarczik \u2013 Hollanders Handlanger. Chellish \u2013 Ein geheimnisvoller junger Mann."}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_15_1", "gold_label" advertisement", "openai_gpt-oss-120b": "reader-information", "openai_gpt-oss-120b_subtype": "preview", "openai_gpt-oss-20b": "reader-information", "openai_gpt-oss-20b_subtype": "preview", "book_file": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json", "section_idx": 17, "chunk_idx": 1, "text": "K\u00f6nnen sich Menschen auch ohne die Verwendung von Raumschiffen als Transportmittel mit \u00dcberlichtgeschwindigkeit bewegen ...? Im \u00bbnormalen\u00ab Universum w\u00e4re dies nat\u00fcrlich ein Ding der Unm\u00f6glichkeit, doch auf dem von den Druuf \u00fcberfallenen Planeten Morag II herrschen keine normalen Verh\u00e4ltnisse mehr \u2013 jedenfalls nicht f\u00fcr Wesen, die dem langsamen Zeitablauf der anderen Dimension nicht unterliegen. So sind die Mitglieder der sechsk\u00f6pfigen Zeit-Expedition unter Leutnant Marcel Rous auf Grund ihrer beibehaltenen Eigenzeit so schnell, dass sie selbst Energiesch\u00fcssen ausweichen k\u00f6nnen, die mit relativer Lichtgeschwindigkeit herannahen! Wer sollte ihnen also etwas anhaben k\u00f6nnen ...? Und doch sind die Mitglieder der Zeit-Expedition verzweifelt! Das Eindringen in die fremde Dimension war ihnen mittels des Linsen-Feldgenerators gelungen \u2013 nun aber, da das \u00bbFenster\u00ab in ihr eigenes Universum verschwunden ist, sind sie zu Gefangenen in Zeit und Raum geworden ..."}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_17_2", "gold_label": NaN, "mistralai_mistral-large-2512": "reader-information", "mistralai_mistral-large-2512_subtype": "castlist", "z-ai_glm-5": "reader-information", "z-ai_glm-5_subtype": "castlist", "deepseek_deepseek-v3.2-speciale": "reader-information", "deepseek_deepseek-v3.2-speciale_subtype": "castlist", "openai_gpt-oss-120b": "reader-information", "openai_gpt-oss-120b_subtype": "castlist", "openai_gpt-oss-20b": "reader-information", "openai_gpt-oss-20b_subtype": "castlist", "book_file": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json", "section_idx": 17, "chunk_idx": 2, "text": "Die Hauptpersonen des Romans Perry Rhodan \u2013 Ist es nur ein gl\u00fccklicher Zufall, der den Administrator des Solaren Imperiums davor bewahrt, im \u00bbMeer der Zeit\u00ab zu versinken ...? Reginald Bull \u2013 Perry Rhodans Freund und Stellvertreter. Erb \u2013 Gustav VI. hat ihn richtig beraten. Leutnant Marcel Rous \u2013 Der Leiter der verschollenen Zeit-Expedition. Gucky \u2013 Der Mausbiber sieht einen Geist. Ras Tschubai \u2013 Ein Teleporter des Mutantenkorps. Kruukh \u2013 Ein gehorsamer Diener seines Herrn."}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_19_0", "gold_label": NaN, "mistralai_mistral-large-2512": "cover-image", "mistralai_mistral-large-2512_subtype": "none", "z-ai_glm-5": "cover-image", "z-ai_glm-5_subtype": "none", "deepseek_deepseek-v3.2-speciale": "cover-image", "deepseek_deepseek-v3.2-speciale_subtype": "none", "openai_gpt-oss-120b": "cover-image", "openai_gpt-oss-120b_subtype": "none", "openai_gpt-oss-20b": "cover-image", "openai_gpt-oss-20b_subtype": "none", "book_file": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json", "section_idx": 19, "chunk_idx": 0, "text": ""}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_20_2", "gold_label": NaN, "mistralai_mistral-large-2512": "reader-information", "mistralai_mistral-large-2512_subtype": "castlist", "z-ai_glm-5": "reader-information", "z-ai_glm-5_subtype": "castlist", "deepseek_deepseek-v3.2-speciale": "reader-information", "deepseek_deepseek-v3.2-speciale_subtype": "castlist", "openai_gpt-oss-120b": "reader-information", "openai_gpt-oss-120b_subtype": "castlist", "openai_gpt-oss-20b": "reader-information", "openai_gpt-oss-20b_subtype": "castlist", "book_file": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json", "section_idx": 20, "chunk_idx": 2, "text": "Die Hauptpersonen des Romans Perry Rhodan \u2013 Seine Unsterblichkeit steht auf dem Spiel, denn der Planet Wanderer ist verschwunden. Reginald Bull \u2013 Die Unanschaulichkeit ist nicht seine St\u00e4rke. Atlan \u2013 Der Einsame der Zeit ist Perry Rhodans Freund geworden. Captain Gorlat und Leutnant Tompetch \u2013 Sie ziehen aus, um einen Roboter zu fangen. Die Solitude-Intelligenz \u2013 Ein seltsames Wesen, das seinen Geist von seinem K\u00f6rper nach Belieben trennen kann."}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_21_0", "gold_label": NaN, "mistralai_mistral-large-2512": "cover-image", "mistralai_mistral-large-2512_subtype": "none", "z-ai_glm-5": "cover-image", "z-ai_glm-5_subtype": "none", "deepseek_deepseek-v3.2-speciale": "cover-image", "deepseek_deepseek-v3.2-speciale_subtype": "none", "openai_gpt-oss-120b": "cover-image", "openai_gpt-oss-120b_subtype": "none", "openai_gpt-oss-20b": "cover-image", "openai_gpt-oss-20b_subtype": "none", "book_file": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json", "section_idx": 21, "chunk_idx": 0, "text": ""}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_21_1", "gold_label": NaN, "mistralai_mistral-large-2512": "reader-information", "mistralai_mistral-large-2512_subtype": "meta-information", "z-ai_glm-5": "reader-information", "z-ai_glm-5_subtype": "meta-information", "deepseek_deepseek-v3.2-speciale": "reader-information", "deepseek_deepseek-v3.2-speciale_subtype": "meta-information", "openai_gpt-oss-120b": "chapter", "openai_gpt-oss-120b_subtype": "none", "openai_gpt-oss-20b": "chapter", "openai_gpt-oss-20b_subtype": "none", "book_file": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json", "section_idx": 21, "chunk_idx": 1, "text": "Das Jahr 2042 ist ein entscheidendes Datum f\u00fcr die beiden f\u00fchrenden M\u00e4nner des Solaren Imperiums! Es ist das Jahr, in dem Perry Rhodan und Reginald Bull unter allen Umst\u00e4nden eine zweite Zelldusche erhalten m\u00fcssen, wollen sie nicht innerhalb weniger Tage ein kl\u00e4gliches Ende nehmen.1976 wurden die beiden M\u00e4nner erstmals im Physiotron der Kunstwelt Wanderer behandelt, mit der Ma\u00dfgabe, in sp\u00e4testens 62 irdischen Jahren wieder zu erscheinen. Bei Dazurechnung der Zeitdilatation, der die Terraner bei der R\u00fcckkehr von der Welt des Unsterblichen ins heimatliche Sonnensystem unterworfen waren, ergibt sich der 1. Mai 2042 als letzter Termin f\u00fcr eine lebenserhaltende Zelldusche. Da die Ellipsenbahn, die der Planet der Unsterblichkeit durch das Universum beschreibt, genau errechnet worden war und auch die sp\u00e4teren Zellduschen weiterer verdienter Menschen ohne Komplikationen abgelaufen waren, sah Perry Rhodan keinen Grund zum verfr\u00fchten Aufbruch nach Wanderer. Bereits die \u00bbHetzjagd durch die Dimensionen\u00ab hat gezeigt, wie irrig diese Annahme war. Um Wanderer doch noch termingerecht erreichen zu k\u00f6nnen, wird es erforderlich, in den \u00bbHalbraum\u00ab einzudringen, in den unstabilen Raum zwischen der vierten und f\u00fcnften Dimension \u2013 doch IM HALBRAUM LAUERT DER TOD ..."}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_22_1", "gold_label": NaN, "mistralai_mistral-large-2512": "reader-information", "mistralai_mistral-large-2512_subtype": "meta-information", "z-ai_glm-5": "reader-information", "z-ai_glm-5_subtype": "meta-information", "deepseek_deepseek-v3.2-speciale": "reader-information", "deepseek_deepseek-v3.2-speciale_subtype": "meta-information", "openai_gpt-oss-120b": "chapter", "openai_gpt-oss-120b_subtype": "none", "openai_gpt-oss-20b": "chapter", "openai_gpt-oss-20b_subtype": "none", "book_file": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json", "section_idx": 22, "chunk_idx": 1, "text": "Atlan, der uralte, doch k\u00f6rperlich und geistig jung und unverbraucht gebliebene Arkonide, war dabei. Er war dabei, als das unter Perry Rhodans Kommando stehende Superschlachtschiff DRUSUS nach langer und verzweifelter Suche endlich auf Wanderer landete, dem k\u00fcnstlichen Planeten, der zugleich die \u00bbQuelle\u00ab der Unsterblichkeit enth\u00e4lt. Auch ohne das Eingreifen der mysteri\u00f6sen Gemeinschaftsintelligenz \u2013 Er oder Es genannt \u2013 gelang es den Terranern, die lebensspendende Zelldusche in Betrieb zu nehmen. Perry Rhodan hatte den Vortritt bei der lebensverl\u00e4ngernden Prozedur! Ihm folgte Reginald Bull, Rhodans \u00e4ltester Freund und Gef\u00e4hrte \u2013 doch tritt nun ein Effekt auf, der Gucky um Bullys Leben zittern l\u00e4sst und der Atlan zu einer zehntausendj\u00e4hrigen R\u00fcckblende auf DIE LETZTEN TAGE VON ATLANTIS f\u00f6rmlich zwingt ..."}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_22_2", "gold_label": NaN, "mistralai_mistral-large-2512": "reader-information", "mistralai_mistral-large-2512_subtype": "castlist", "z-ai_glm-5": "reader-information", "z-ai_glm-5_subtype": "castlist", "deepseek_deepseek-v3.2-speciale": "reader-information", "deepseek_deepseek-v3.2-speciale_subtype": "castlist", "openai_gpt-oss-120b": "reader-information", "openai_gpt-oss-120b_subtype": "castlist", "openai_gpt-oss-20b": "reader-information", "openai_gpt-oss-20b_subtype": "meta-information", "book_file": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json", "section_idx": 22, "chunk_idx": 2, "text": "Die Hauptpersonen des Romans Perry Rhodan \u2013 Erster Administrator des Solaren Imperiums. Reginald Bull \u2013 Er will sich t\u00f6ten, bevor er das Stadium eines lallenden Babys erreicht. Gucky \u2013 Der Mausbiber zittert um das Leben seines Freundes. Homunk \u2013 Ein Wunderwerk der Robotik. Atlan \u2013 Man verhaftet ihn, um ihn zu retten. Tarts, Inkar, Ursaf und Cun\u00f3r \u2013 Die M\u00e4nner sind seit Jahrtausenden tot, aber das photographische Ged\u00e4chtnis Atlans erweckt sie zu neuem Leben."}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.jso file": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json", "section_idx": 26, "chunk_idx": 1, "text": "Ehe Perry Rhodan, der Administrator des Solaren Imperiums, nach weiteren Wegen sucht, um der Druuf-Gefahr Herr zu werden, die alles Leben in der Milchstra\u00dfe bedroht, will er sich den R\u00fccken freihalten. Mit anderen Worten: Perry Rhodan will wissen, ob etwa sein alter Widersacher und scheinbarer Bundesgenosse, der Robotregent von Arkon, inzwischen geheime St\u00fctzpunkte gebaut oder auf fremden Planeten Agenten abgesetzt hat, die der Erde gef\u00e4hrlich werden k\u00f6nnten. Die Expedition der K-262 nach Eppan ist eine reine Routinefahrt im Sinne dieser weitgespannten Kontrollaufgabe, die gleichzeitig noch von vielen anderen Teams der solaren Raumflotte erledigt wird. Was aber die M\u00e4nner der K-262 erleben, ist keine Routine \u2013 es ist DAS GRAUEN ..."}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_26_2", "gold_label": NaN, "mistralai_mistral-large-2512": "reader-information", "mistralai_mistral-large-2512_subtype": "castlist", "z-ai_glm-5": "reader-information", "z-ai_glm-5_subtype": "castlist", "deepseek_deepseek-v3.2-speciale": "reader-information", "deepseek_deepseek-v3.2-speciale_subtype": "castlist", "openai_gpt-oss-120b": "reader-information", "openai_gpt-oss-120b_subtype": "castlist", "openai_gpt-oss-20b": "reader-information", "openai_gpt-oss-20b_subtype": "castlist", "book_file": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json", "section_idx": 26, "chunk_idx": 2, "text": "Die Hauptpersonen des Romans Colonel Marcus Everson \u2013 Kommandant der K-262. Walt Scoobey \u2013 Erster Offizier der K-262. Goldstein \u2013 Ein junger Telepath, der auf dem Planeten Eppan erstmals zum Einsatz kommt. Mataal \u2013 Ein Gladiator von Eppan. Kadett Ramirez \u2013 Er wird das erste Opfer des namenlosen Grauens."}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_27_0", "gold_label": NaN, "mistralai_mistral-large-2512": "cover-image", "mistralai_mistral-large-2512_subtype": "none", "z-ai_glm-5": "cover-image", "z-ai_glm-5_subtype": "none", "deepseek_deepseek-v3.2-speciale": "cover-image", "deepseek_deepseek-v3.2-speciale_subtype": "none", "openai_gpt-oss-120b": "cover-image", "openai_gpt-oss-120b_subtype": "none", "openai_gpt-oss-20b": "cover-image", "openai_gpt-oss-20b_subtype": "none", "book_file": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json", "section_idx": 27, "chunk_idx": 0, "text": ""}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_28_0", "gold_label": NaN, "mistralai_mistral-large-2512": "cover-image", "mistralai_mistral-large-2512_subtype": "none", "z-ai_glm-5": "cover-image", "z-ai_glm-5_subtype": "none", "deepseek_deepseek-v3.2-speciale": "cover-image", "deepseek_deepseek-v3.2-speciale_subtype": "none", "openai_gpt-oss-120b": "cover-image", "openai_gpt-oss-120b_subtype": "none", "openai_gpt-oss-20b": "cover-image", "openai_gpt-oss-20b_subtype": "none", "book_file": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json", "section_idx": 28, "chunk_idx": 0, "text": ""}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_28_1", "gold_label": NaN, "mistralai_mistral-large-2512": "reader-information", "mistralai_mistral-large-2512_subtype": "meta-information", "z-ai_glm-5": "reader-information", "z-ai_glm-5_subtype": "meta-information", "deepseek_deepseek-v3.2-speciale": "reader-information", "deepseek_deepseek-v3.2-speciale_subtype": "advertisement", "openai_gpt-oss-120b": "reader-information", "openai_gpt-oss-120b_subtype": "preview", "openai_gpt-oss-20b": "reader-information", "openai_gpt-oss-20b_subtype": "preview", "book_file": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json", "section_idx": 28, "chunk_idx": 1, "text": "Perry Rhodan ist erstmals rein zuf\u00e4llig den geheimnisvollen Fremden aus der anderen Zeitebene von Angesicht zu Angesicht begegnet und ist dabei zusammen mit Atlan, dem arkonidischen Freund, und Fellmer Lloyd, dem Mutanten, in eine mehr als fatale Situation geraten, die nur durch das unerwartete Eingreifen eines noch unbekannten Helfers bereinigt werden k\u00f6nnte. Perry Rhodan kann jede Hilfe brauchen, besonders jetzt, da er den Plan entwickelt hat, den Robotregenten von Arkon und die Druuf, deren gewaltige Raumflotten sich an der Grenze zwischen den beiden Zeitebenen bereits die erbittertsten Schlachten liefern, gegeneinander auszuspielen und so das Solare Imperium der Menschheit vor dem Untergang oder der Versklavung zu bewahren. Und im Moment seiner R\u00fcckkehr zum Flottenst\u00fctzpunkt Gray Beast erinnert sich Perry Rhodan an ein r\u00e4tselhaftes Wesen, das vor vielen Jahrzehnten die Terraner bereits unterst\u00fctzt hatte ... Der solare Administrator schickt an dieses Wesen eine Einladung aus, ihn zu begleiten zu seinem neuen Unternehmen UNTER DEN STERNEN VON DRUUFON ..."}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_29_0", "gold_label": NaN, "mistralai_mistral-large-2512": "cover-image", "mistralai_mistral-large-2512_subtype": "none", "z-ai_glm-5": "cover-image", "z-ai_glm-5_subtype": "none", "deepseek_deepseek-v3.2-speciale": "cover-image", "deepseek_deepseek-v3.2-speciale_subtype": "none", "openai_gpt-oss-120b": "cover-image", "openai_gpt-oss-120b_subtype": "none", "openai_gpt-oss-20b": "cover-image", "openai_gpt-oss-20b_subtype": "none", "book_file": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json", "section_idx": 29, "chunk_idx": 0, "text": ""}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_29_1", "gold_label": NaN, "mistralai_mistral-large-2512": "reader-information", "mistralai_mistral-large-2512_subtype": "meta-information", "z-ai_glm-5": "reader-information", "z-ai_glm-5_subtype": "meta-information", "deepseek_deepseek-v3.2-spe t-oss-120b": "chapter", "openai_gpt-oss-120b_subtype": "none", "openai_gpt-oss-20b": "chapter", "openai_gpt-oss-20b_subtype": "none", "book_file": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json", "section_idx": 43, "chunk_idx": 1, "text": "Als im Jahre 1971 mit der Entdeckung des auf dem Mond gestrandeten arkonidischen Forschungsraumers der Grundstein zur Vereinigung der irdischen Menschheit und dem aus dieser Vereinigung erwachsenden Solaren Imperium gelegt wurde, ahnte noch niemand \u2013 auch nicht Perry Rhodan, der Begr\u00fcnder des terranischen Sternenreiches \u2013, welche Anstrengungen und Nervenkraft es im Laufe der Jahre kosten w\u00fcrde, dieses Reich gegen\u00fcber Angriffen von innen und au\u00dfen zu erhalten. Die bisher gef\u00e4hrlichste Bedrohung der Menschheit, die in der \u00bbSchlacht um Terra\u00ab gipfelte, konnte dank arkonidischer Hilfe gebannt werden, ebenso wie die von Thomas Cardif, dem Renegaten, heraufbeschworene innenpolitische Gefahr durch Guckys Alleingang beseitigt werden konnte. Eine friedliche Weiterentwicklung der Menschheit kann aber nur m\u00f6glich sein, wenn in der Galaxis selbst Friede herrscht \u2013 und bis dahin scheint es noch ein weiter Weg zu sein ... Auch Atlan, der Unsterbliche, der erst vor kurzem die gigantische Maschine abgel\u00f6st hatte, die mit ihren unerbittlich zuschlagenden Robotflotten jede Revolution gegen die arkonidische Zentralgewalt im Keime zu ersticken pflegte, will den Frieden. Atlan, jetzt Imperator Gonozal VIII genannt, und Perry Rhodan, der Administrator des Solaren Imperiums, unterst\u00fctzen sich \u2013 schon aus reinem Selbsterhaltungstrieb \u2013 gegenseitig bei ihren Bem\u00fchungen. Und so weilt Perry Rhodan in den ersten Augusttagen des Jahres 2044 auf Arkon III, als ein Notruf von Terra eintrifft. Marschall Freyt ist am Telekom. Er vermittelt eine Nachricht von Hades, dem terranischen Geheimst\u00fctzpunkt im Druuf-Universum. Es geht um ERNST ELLERTS R\u00dcCKKEHR! nn f\u00fcr die Erde getan hat. Und jeder wei\u00df, wem man dieses Denkmal errichtet hat. Der stumme Betrachter wendet sich langsam wieder ab. Er l\u00e4uft quer \u00fcber die Wiese. Ein Lasttaxi kreist \u00fcber ihm. Er schaut nicht auf. Seine Gedanken sind bei jenem Mann aus Stein. Es sind dankbare Gedanken. Seine Lippen formen den Namen des Mannes, als wolle er sich ihn f\u00fcr alle Zeiten unausl\u00f6schlich einpr\u00e4gen: \u00bbCrest!\u00ab"}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_52_1", "gold_label": NaN, "mistralai_mistral-large-2512": "reader-information", "mistralai_mistral-large-2512_subtype": "meta-information", "z-ai_glm-5": "reader-information", "z-ai_glm-5_subtype": "editorial", "deepseek_deepseek-v3.2-speciale": "reader-information", "deepseek_deepseek-v3.2-speciale_subtype": "editorial", "openai_gpt-oss-120b": "reader-information", "openai_gpt-oss-120b_subtype": "advertisement", "openai_gpt-oss-20b": "reader-information", "openai_gpt-oss-20b_subtype": "preview", "book_file": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json", "section_idx": 52, "chunk_idx": 1, "text": "Liebe Leserinnen, liebe Leser, ich will Sie zu einer Reise einladen \u2013 zu einer Reise in eine phantastische Welt der Zukunft. Es ist eine Welt, in der die Menschheit nicht mehr in kleinliche Streitigkeiten auf ihrem eigenen Planeten verwickelt ist, sondern l\u00e4ngst die Reise zu fremden Welten angetreten und diese besiedelt hat. In dieser Welt spielt die PERRY RHODAN-Serie: Sie beginnt in unserer Zeit, und sie ist nach zahllosen Abenteuern in einer 300 Jahre weit entfernten Zukunft angekommen. Auf dem Weg in diese Zukunft begegnen die Menschen zahlreichen fremden Wesen. Au\u00dferirdische sind darunter, die wie Monster aussehen und stattdessen feinsinnige K\u00fcnstler sind, ebenso uralte Intelligenzen, die Jahrmillionen \u00fcberdauert haben und unglaubliche F\u00e4higkeiten besitzen, aber auch b\u00f6sartige Feinde, eder w\u00fcrden sie zu viert sein. Wieder w\u00fcrde es ein h\u00f6chst gef\u00e4hrliches Unternehmen werden, ein Risiko ohnegleichen. Noch einmal dasselbe. Und zugleich etwas total anderes. Wiederholt sich Geschichte? Es sah so aus. Mit einem winzigen, aber bedeutungsvollen Unterschied: Es gab keine Garantie, dass diesmal wieder etwas begann. Es konnte genauso gut sein, dass diesmal alles endete."}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_53_0", "gold_label": NaN, "mistralai_mistral-large-2512": "cover-image", "mistralai_mistral-large-2512_subtype": "none", "z-ai_glm-5": "cover-image", "z-ai_glm-5_subtype": "none", "deepseek_deepseek-v3.2-speciale": "cover-image", "deepseek_deepseek-v3.2-speciale_subtype": "none", "openai_gpt-oss-120b": "cover-image", "openai_gpt-oss-120b_subtype": "none", "openai_gpt-oss-20b": "cover-image", "openai_gpt-oss-20b_subtype": "none", "book_file": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json", "section_idx": 53, "chunk_idx": 0, "text": ""}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_53_1", "gold_label": NaN, "mistralai_mistral-large-2512": "cover-image", "mistralai_mistral-large-2512_subtype": "none", "z-ai_glm-5": "cover-image", "z-ai_glm-5_subtype": "none", "deepseek_deepseek-v3.2-speciale": "cover-image", "deepseek_deepseek-v3.2-speciale_subtype": "none", "openai_gpt-oss-120b": "cover-image", "openai_gpt-oss-120b_subtype": "none", "openai_gpt-oss-20b": "cover-image", "openai_gpt-oss-20b_subtype": "none", "book_file": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json", "section_idx": 53, "chunk_idx": 1, "text": ""}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_53_2", "gold_label": NaN, "mistralai_mistral-large-2512": "reader-information", "mistralai_mistral-large-2512_subtype": "editorial", "z-ai_glm-5": "reader-information", "z-ai_glm-5_subtype": "editorial", "deepseek_deepseek-v3.2-spec  zugleich als Vorsitzender des Galaktikums dient, ist das Volk der Arkoniden sehr eng mit dem Galaktikum verflochten. Parallel zieht es sich allerdings mehr und mehr in eine neue Dekadenz zur\u00fcck, indem sich viele Arkoniden in die virtuelle Welten unter der Messinghaube begaben. DIE SUPERINTELLIGENZENBei den sogenannten Superintelligenzen handelt es sich um m\u00e4chtige, vergeistigte Wesen, die meist aus den Bewusstseinspotenzialen eines oder mehrerer weit entwickelter V\u00f6lker entstehen. Sie bilden eine Stufe der kosmischen Entwicklung, die \u00fcber der Ebene der \u00bbeinfachen\u00ab Intelligenzwesen einer interstellaren Zivilisation steht. Je nachdem, ob sie der Seite des Chaos oder der Ordnung zugeneigt sind, werden sie als \u00bbpositive\u00ab oder \u00bbnegative\u00ab Superintelligenzen bezeichnet. Sie herrschen \u00fcber sogenannte M\u00e4chtigkeitsballungen, viele Galaxien umfassende Bereiche des Kosmos, die sie in ihrem Sinn zu lenken versuchen. Die Superintelligenz, in deren Einflussbereich die Terraner leben, nennt sich ES und trat schon fr\u00fch als Mentor dieses jungen Sternenvolkes in Erscheinung. Vor Kurzem teilte sich ES im Zuge seiner Entwicklung in zwei voneinander getrennte Wesenheiten: ES und TALIN. DIE HOHEN M\u00c4CHTE DES UNIVERSUMSAuch die Superintelligenzen stellen nicht das Ende der kosmischen Entwicklung dar. Sie entwickeln sich zu Materiequellen oder -senken weiter, aus denen wiederum Kosmokraten oder Chaotarchen entstehen. Diese Wesenheiten sind dem einfachen Leben auf der Stufe eines Menschen v\u00f6llig fremd \u2026 wie sie umgekehrt die Niederungen des einfachen Lebens nicht mehr verstehen k\u00f6nnen."}, {"id": "000730_Perry_Rhodan-Paket_2__Atlan_und_-_Perry_Rhodan_Redaktion.json_53_5", "gold_label": NaN, "mistralai_mistral-large-2512": "reader-information", "mistralai_mistral-large-2512_subtype": "advertisement", "z-ai_glm-5": "reader-information", "z-ai_glm-5_subtype": "advertisement", "deepseek_deepseek-v3.2-speciale": " rdess merkte, wie sich bei diesen Worten seine Finger fast zu einer Faust zusammenballten. Er hatte sich angew\u00f6hnt, so etwas sofort zu registrieren und sich dann innerlich zu beruhigen. Bei Murray Dean, der ihm gerade gegen\u00fcberstand, fiel es ihm allerdings schwer. Fr\u00fcher waren sie Freunde und Gesch\u00e4ftspartner gewesen. Doch Murray hatte eine andere Auffassung von Loyalit\u00e4t als Rook.\u201eWas bekommst du daf\u00fcr, dass du dich f\u00fcr sie einsetzt?\u201c, fragte Rook, nachdem er einen tiefen Atemzug genommen hatte. Murray zuckte mit den Schultern. \u201eNichts.\u201c\u201eDu meinst, dass du momentan noch nichts daf\u00fcr bekommst.\u201cDie Muskeln an Murrays Kiefer spannten sich deutlich an. \u201eRook, ich bin nicht blind. Und Viva ist es auch nicht. Sie muss diese Chance nutzen, verstehst du das nicht?\u201c Er lehnte sich an die Wand des Flurs und deutete l\u00e4ssig mit dem Daumen in Richtung der gro\u00dfen Halle, in der die Party des Abends stattfand.\u201c Er l\u00e4chelte schlau. \u201eWas ist falsch daran, dass sie auf einem dieser langweiligen Events einen den bekanntesten Filmproduzenten des Landes trifft und sich mit ihm unterh\u00e4lt? Ich habe nichts weiter getan, als ihr ein paar T\u00fcren zu \u00f6ffnen. Du solltest dich f\u00fcr sie freuen.\u201c\u201eDas w\u00fcrde ich\u201c, presste Rook hervor. \u201eWenn ich nicht das dumpfe Gef\u00fchl h\u00e4tte, dass du ein falsches Spiel spielst.\u201c\u201eWarum sollte ich das tun? Was h\u00e4tte ich davon?\u201cRook sch\u00fcttelte den Kopf. \u201eIch wei\u00df es nicht. Aber ich kenne dich. Du machst nichts, ohne dabei deinen eigenen Vorteil im Blick zu haben.\u201cMurray pfiff leise durch die Z\u00e4hne. \u201eOh, sind wir wieder bei den alten Geschichten?\u201c\u201eDu meinst die Geschichte, in der du meine Sicherheitsfirma verlassen und alle meine Mitarbeiter dazu angestiftet hast, es dir gleichzutun? Und bei dir neu anzufangen? Ja, eventuell hat das meine gute Meinung von d 6rungen spezialisiert ist \u2013 und begegnet kurz darauf der jungen Hexe Coco Zamis, die von ihrer Familie den Auftrag erhalten hat, Dorian zu t\u00f6ten. Doch Coco verliebt sich in den D\u00e4monenkiller und wechselt die Seiten, wodurch sie nicht nur ihre magischen F\u00e4higkeiten verliert, sondern dar\u00fcber hinaus aus der Schwarzen Familie ausgesto\u00dfen wird. Coco wie auch Dorian sind nun gleichzeitig J\u00e4ger und Gejagte, denn Dorian hat sich geschworen, seine Br\u00fcder, die das Feuer auf Schloss Lethian offenbar allesamt \u00fcberlebt haben, zur Strecke zu bringen. In London t\u00f6tet er Roberto Copello, nachdem dieser den Secret-Service-Agenten Donald Chapman auf Puppengr\u00f6\u00dfe geschrumpft hat. Mit Hilfe des Secret Service gr\u00fcndet Dorian die \u00bbInquisitionsabteilung\u00ab, der nicht nur er selbst, sondern auch Coco und der Puppenmann Chapman fortan angeh\u00f6ren. Ein weiteres \u00bbinoffizielles\u00ab Mitglied ist der geheimnisvolle Hermaphrodit Phillip, dessen Adoptiveltern von D\u00e4monen get\u00f6tet wurden. Zum Hauptquartier der Inquisitionsabteilung wird die Jugendstilvilla in der Baring Road, in der Phillip aufgewachsen ist, doch gleichzeitig st\u00f6bert Dorian Hunter weiter in der Bibliothek seines alten Reihenhauses in der Abraham Road nach Hinweisen auf d\u00e4monische Umtriebe \u2013 und st\u00f6\u00dft auf das Tagebuch des Barons Nicolas de Conde, der auf dem Eulenberg nahe Nancy im Jahr 1484 seine Seele dem Teufel verkaufte. De Conde bereute, wurde zum Hexenj\u00e4ger und Mitautor des \u00bbHexenhammers\u00ab und starb als angeblicher Ketzer. Der Fluch erf\u00fcllte sich. Seither wird de Condes Seele nach jedem Tod in einem neuen K\u00f6rper wiedergeboren \u2013 und tats\u00e4chlich gelingt es ihm als Dorian Hunter, nicht nur sieben seiner Br\u00fcder, sondern schlie\u00dflich auch seinen Vater Asmodi zu vernichten! Nach dem Kampf gegen die D\u00e4monen-Drillinge gelangt Dorian \u00fcber die Ukraine, die T\u00fcrkei un             const reader = new FileReader();

                    const idIdx = header.indexOf('id');
                    const labelIdx = header.indexOf('gold_label');
                    const subtypeIdx = header.indexOf('gold_label_subtype');
                    
                    if (idIdx === -1 || labelIdx === -1) {
                        showStatus('Invalid TSV format: missing "id" or "gold_label" column', 'error');
                        return;
